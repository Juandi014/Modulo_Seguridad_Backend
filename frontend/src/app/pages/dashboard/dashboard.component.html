<div class="container-fluid page-content">
  <!-- Bienvenida -->
  <div class="card shadow mb-4 hero-card">
    <i class="fas fa-futbol hero-watermark"></i>
    <div class="card-body d-flex align-items-center flex-wrap">
      <span class="avatar-initials avatar-initials-lg mr-4 mb-2">{{user?.name?.charAt(0) || '?'}}</span>
      <div class="mb-2">
        <h2 class="mb-1">Hola, {{user?.name}}</h2>
        <p class="text-muted mb-0">Bienvenido a la plataforma administrativa de SportManager.</p>
        <div class="hero-chips">
          <span class="hero-chip">
            <i class="fas fa-sign-in-alt"></i>
            Sesión iniciada con&nbsp;<strong>{{providerLabels[user?.authProvider] || '-'}}</strong>
          </span>
          <span class="hero-chip">
            <i class="far fa-clock"></i>
            Vence a las&nbsp;<strong>{{user?.expiresAt | date:'HH:mm'}}</strong>
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Accesos directos -->
  <h3 class="section-title">Módulo de seguridad</h3>
  <div class="row module-grid">
    <div class="col-xl-3 col-lg-4 col-md-6 mb-4" *ngFor="let shortcut of shortcuts">
      <a class="card shadow module-card h-100" [routerLink]="[shortcut.path]">
        <div class="card-body">
          <i class="fas fa-arrow-right module-card-arrow"></i>
          <span class="module-card-icon"><i class="ni {{shortcut.icon}}"></i></span>
          <h4 class="mt-3 mb-1">{{shortcut.title}}</h4>
          <p class="text-muted mb-0">{{shortcut.description}}</p>
        </div>
      </a>
    </div>
  </div>
</div>
