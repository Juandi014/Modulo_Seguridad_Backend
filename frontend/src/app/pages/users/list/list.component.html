<!-- Page content -->
<div class="container-fluid page-content">
    <!-- Table -->
    <div class="row">
        <div class="col">
            <div class="card shadow">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">Listado de usuarios</h3>
                    <button class="btn btn-primary" (click)="create()"><i class="ni ni-fat-add"></i> Crear usuario</button>
                </div>
                <div class="card-body table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Correo</th>
                                <th>Acceso</th>
                                <th>Estado</th>
                                <th>Opciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let user of users">
                                <td>{{user.id}}</td>
                                <td>{{user.name}}</td>
                                <td>{{user.email}}</td>
                                <td><span class="badge badge-secondary">{{providerLabels[user.authProvider] || '-'}}</span></td>
                                <td>
                                    <span class="badge" [ngClass]="user.active ? 'badge-state-on' : 'badge-state-off'">
                                        {{user.active ? 'Activo' : 'Inactivo'}}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" (click)="view(user.id)">Ver</button>
                                    <button class="btn btn-sm btn-secondary" (click)="edit(user.id)">Editar</button>
                                    <button class="btn btn-sm btn-secondary" (click)="profile(user.id)">Perfil</button>
                                    <button class="btn btn-sm btn-secondary" (click)="roles(user.id)">Roles</button>
                                    <button *ngIf="user.active" class="btn btn-sm btn-secondary" (click)="deactivate(user)">Desactivar</button>
                                    <button *ngIf="!user.active" class="btn btn-sm btn-secondary" (click)="activate(user)">Activar</button>
                                </td>
                            </tr>
                            <tr *ngIf="users.length == 0">
                                <td colspan="6" class="text-center text-muted">No hay usuarios registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
