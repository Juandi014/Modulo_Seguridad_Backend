<div class="container auth-container">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card shadow border-0">
        <div class="card-header auth-card-header">
          <h2 class="mb-1">Nueva contraseña</h2>
          <p class="text-muted mb-0">Establezca la nueva contraseña de su cuenta.</p>
        </div>
        <div class="card-body px-lg-5 py-lg-5">
          <p *ngIf="validLink === null" class="text-center text-muted mb-0">Verificando el enlace...</p>

          <div *ngIf="validLink === false" class="text-center">
            <div class="alert alert-danger">{{invalidMessage}}</div>
            <a [routerLink]="['/forgot-password']" class="btn btn-primary">Solicitar un nuevo enlace</a>
          </div>

          <form *ngIf="validLink" role="form" [formGroup]="theFormGroup" (ngSubmit)="reset()">
            <div class="form-group">
              <label class="form-control-label">Nueva contraseña</label>
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                </div>
                <input class="form-control" type="password" formControlName="newPassword" autocomplete="new-password">
              </div>
              <small class="text-muted">{{passwordRuleMessage}}</small>
              <div *ngIf="showErrors('newPassword')">
                <strong *ngIf="getTheFormGroup.newPassword.errors.required" class="msnError">Requerido</strong>
                <strong *ngIf="getTheFormGroup.newPassword.errors.pattern" class="msnError">
                  La contraseña no cumple las reglas de seguridad</strong>
              </div>
            </div>
            <div class="form-group">
              <label class="form-control-label">Confirmar nueva contraseña</label>
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                </div>
                <input class="form-control" type="password" formControlName="confirmPassword" autocomplete="new-password">
              </div>
              <div *ngIf="showErrors('confirmPassword')">
                <strong *ngIf="getTheFormGroup.confirmPassword.errors.required" class="msnError">Requerido</strong>
              </div>
              <div *ngIf="theFormGroup.errors?.mismatch && (getTheFormGroup.confirmPassword.dirty || trySend)">
                <strong class="msnError">Las contraseñas no coinciden</strong>
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary mt-2" [disabled]="sending">Guardar nueva contraseña</button>
            </div>
          </form>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 text-center">
          <a [routerLink]="['/login']"><small>Volver a iniciar sesión</small></a>
        </div>
      </div>
    </div>
  </div>
</div>
