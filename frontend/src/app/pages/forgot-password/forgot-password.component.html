<div class="container auth-container">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card shadow border-0">
        <div class="card-header auth-card-header">
          <h2 class="mb-1">Recuperar contraseña</h2>
          <p class="text-muted mb-0">Le enviaremos un enlace temporal para establecer una nueva contraseña.</p>
        </div>
        <div class="card-body px-lg-5 py-lg-5">
          <div *ngIf="sentMessage" class="alert alert-success mb-0">
            {{sentMessage}}
          </div>
          <form *ngIf="!sentMessage" role="form" [formGroup]="theFormGroup" (ngSubmit)="send()">
            <div class="form-group">
              <label class="form-control-label">Correo electrónico de su cuenta</label>
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                </div>
                <input class="form-control" placeholder="correo@ejemplo.com" type="email" formControlName="email">
              </div>
              <div *ngIf="getTheFormGroup.email.errors && (getTheFormGroup.email.touched || trySend)">
                <strong *ngIf="getTheFormGroup.email.errors.required" class="msnError">Requerido</strong>
                <strong *ngIf="getTheFormGroup.email.errors.email" class="msnError">Formato de correo inválido</strong>
              </div>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary mt-2" [disabled]="sending">Enviar enlace</button>
            </div>
          </form>
          <hr>
          <p class="text-center text-muted mb-0">
            <small>Si su cuenta usa Google, GitHub o Facebook, recupere el acceso directamente con ese proveedor.</small>
          </p>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 text-center">
          <a [routerLink]="['/login']"><small>Volver a iniciar sesión</small></a>
        </div>
      </div>
    </div>
  </div>
</div>
