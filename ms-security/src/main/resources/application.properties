spring.application.name=security_ms
server.port=8181
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_ms_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}

# Duración de la sesión interna (token) en minutos
security.session.duration-minutes=${SESSION_DURATION_MINUTES:10}

# URL del frontend, a donde se vuelve después del login OAuth
security.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Proveedores OAuth (vacíos = deshabilitados). URL de retorno a registrar
# en cada proveedor: http://localhost:8181/login/oauth2/code/{google|github|facebook}
security.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
security.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
security.oauth.github.client-id=${GITHUB_CLIENT_ID:}
security.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
security.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
security.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}

# Autenticación de dos factores: vigencia del código y máximo de intentos
security.two-factor.code-minutes=${TWO_FACTOR_CODE_MINUTES:5}
security.two-factor.max-attempts=${TWO_FACTOR_MAX_ATTEMPTS:5}

# Recuperación de contraseña: vigencia del enlace en minutos
security.password-recovery.duration-minutes=${PASSWORD_RECOVERY_MINUTES:15}

# Correo. Sin MAIL_HOST los correos se muestran en la consola del backend.
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=su correo y
# MAIL_PASSWORD=contraseña de aplicación (no la contraseña normal)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
security.mail.from=${MAIL_FROM:SportManager <no-reply@sportmanager.local>}

security.seed-admin.email=${SEED_ADMIN_EMAIL:admin@uc.edu.co}
security.seed-admin.password=${SEED_ADMIN_PASSWORD:}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Fotografías de perfil (máximo 2 MB; el límite de Spring es algo mayor
# para que el servicio responda con un mensaje claro)
storage.profile-photos.dir=${PROFILE_PHOTOS_DIR:uploads/profile-photos}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
